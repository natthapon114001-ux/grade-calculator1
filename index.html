<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรแกรมคำนวณเกรด</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px
}
.card{
  width:100%;max-width:520px;background:#fff;border-radius:20px;
  padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.12)
}
h1{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#64748b;margin-bottom:24px}
label{display:block;font-weight:bold;margin:14px 0 6px}
input{
  width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;
  font-size:16px
}
button{
  width:100%;padding:13px;margin-top:18px;border:0;border-radius:10px;
  background:#4f46e5;color:white;font-size:16px;font-weight:bold;cursor:pointer
}
button:hover{opacity:.9}
.reset{background:#64748b}
.result{
  margin-top:22px;padding:20px;border-radius:14px;background:#f1f5f9;
  text-align:center;display:none
}
.grade{font-size:48px;font-weight:bold;margin:5px}
.message{font-size:18px;font-weight:bold}
.error{color:#dc2626;margin-top:10px;text-align:center}
table{width:100%;border-collapse:collapse;margin-top:18px}
th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>📚 โปรแกรมคำนวณเกรด</h1>
  <div class="sub">กรอกคะแนนแต่ละส่วน แล้วกดคำนวณ</div>

  <label>ชื่อผู้เรียน</label>
  <input id="name" type="text" placeholder="เช่น ณัฐพล">

  <label>คะแนนเก็บ (เต็ม 50)</label>
  <input id="work" type="number" min="0" max="50" placeholder="0 - 50">

  <label>คะแนนสอบกลางภาค (เต็ม 20)</label>
  <input id="mid" type="number" min="0" max="20" placeholder="0 - 20">

  <label>คะแนนสอบปลายภาค (เต็ม 30)</label>
  <input id="final" type="number" min="0" max="30" placeholder="0 - 30">

  <button onclick="calculate()">คำนวณเกรด</button>
  <button class="reset" onclick="resetForm()">ล้างข้อมูล</button>

  <div id="error" class="error"></div>

  <div id="result" class="result">
    <div id="student"></div>
    <div>คะแนนรวม</div>
    <div id="total" style="font-size:30px;font-weight:bold"></div>
    <div class="grade" id="grade"></div>
    <div class="message" id="message"></div>

    <table>
      <tr><th>ช่วงคะแนน</th><th>เกรด</th></tr>
      <tr><td>80 - 100</td><td>A</td></tr>
      <tr><td>75 - 79</td><td>B+</td></tr>
      <tr><td>70 - 74</td><td>B</td></tr>
      <tr><td>65 - 69</td><td>C+</td></tr>
      <tr><td>60 - 64</td><td>C</td></tr>
      <tr><td>55 - 59</td><td>D+</td></tr>
      <tr><td>50 - 54</td><td>D</td></tr>
      <tr><td>0 - 49</td><td>F</td></tr>
    </table>
  </div>
</div>

<script>
function getNumber(id){
  const value = document.getElementById(id).value;
  return value === "" ? NaN : Number(value);
}

function calculate(){
  const name = document.getElementById("name").value.trim() || "ผู้เรียน";
  const work = getNumber("work");
  const mid = getNumber("mid");
  const final = getNumber("final");
  const error = document.getElementById("error");
  const result = document.getElementById("result");

  error.textContent = "";
  result.style.display = "none";

  if ([work,mid,final].some(Number.isNaN)){
    error.textContent = "กรุณากรอกคะแนนให้ครบทุกช่อง";
    return;
  }
  if (work<0 || work>50 || mid<0 || mid>20 || final<0 || final>30){
    error.textContent = "กรุณาตรวจสอบคะแนน: คะแนนต้องไม่เกินคะแนนเต็ม";
    return;
  }

  const total = work + mid + final;
  let grade, message;

  if(total >= 80){grade="A";message="ยอดเยี่ยม";}
  else if(total >= 75){grade="B+";message="ดีมาก";}
  else if(total >= 70){grade="B";message="ดี";}
  else if(total >= 65){grade="C+";message="ค่อนข้างดี";}
  else if(total >= 60){grade="C";message="พอใช้";}
  else if(total >= 55){grade="D+";message="ผ่าน";}
  else if(total >= 50){grade="D";message="ผ่านขั้นต่ำ";}
  else {grade="F";message="ไม่ผ่าน";}

  document.getElementById("student").textContent = "ชื่อ: " + name;
  document.getElementById("total").textContent = total.toFixed(2) + " / 100";
  document.getElementById("grade").textContent = grade;
  document.getElementById("message").textContent = message;
  result.style.display = "block";
}

function resetForm(){
  document.getElementById("name").value="";
  document.getElementById("work").value="";
  document.getElementById("mid").value="";
  document.getElementById("final").value="";
  document.getElementById("error").textContent="";
  document.getElementById("result").style.display="none";
}
</script>
</body>
</html>
